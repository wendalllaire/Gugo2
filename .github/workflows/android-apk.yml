name: Android Debug APK

on:
  push:
    branches:
      - build/android-apk-capacitor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Test domino vision regression suite
        run: npm run test:domino-vision

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android camera permission
        run: node scripts/prepare-android.mjs

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DominoMexicano-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoMexicano-debug-apk
          path: artifacts/DominoMexicano-debug.apk
          if-no-files-found: error
          retention-days: 14
