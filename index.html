    <script>
      // Suppress benign Vite HMR WebSocket disconnection errors per platform guidelines
      window.addEventListener('error', function (event) {
        if (event && (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        const reason = event && event.reason;
        const msg = String(reason?.message || reason || '');
        const stack = String(reason?.stack || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || stack.includes('@vite/client')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
